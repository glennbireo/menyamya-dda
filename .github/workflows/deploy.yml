name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for the deploy-pages action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; new pushes cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # NEXT_PUBLIC_BASE_PATH tells next.config.ts to prefix all links and
        # asset URLs with /menyamya-dda so they resolve correctly on GitHub Pages.
        env:
          NEXT_PUBLIC_BASE_PATH: /menyamya-dda
        run: npm run build

      # GitHub Actions Pages deployment bypasses Jekyll, but adding .nojekyll
      # also protects against accidental branch-based deployments in future.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
